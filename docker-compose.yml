# ---------------------------------------------------------------
# Yayasan Kasih Ananda Web Portal — development stack
#
# Services
#   db        MariaDB 11.4 LTS
#   wordpress WordPress 7.1 (core extracted from wordpress-7.1.zip into ./wp)
#   wpcli     WP-CLI runner (one-shot container used by ./scripts/*)
#   pma       phpMyAdmin (optional convenience)
#   mailpit   local SMTP sink — no development mail ever leaves the machine
#
# Nothing in this file is used in production. Production runs on plain
# PHP/MySQL WordPress hosting with no Docker and no Node.
# ---------------------------------------------------------------

name: ${COMPOSE_PROJECT_NAME:-yka}

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: ${DB_NAME:-yka_wordpress}
  WORDPRESS_DB_USER: ${DB_USER:-yka}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-yka}
  WORDPRESS_TABLE_PREFIX: ${DB_TABLE_PREFIX:-wp_}
  WORDPRESS_DEBUG: ${WP_DEBUG:-true}
  # Development-only configuration injected into wp-config.php.
  # The host is resolved at runtime so the same database works from
  # localhost and from a Codespaces forwarded URL without rewriting
  # siteurl/home on every environment switch.
  WORDPRESS_CONFIG_EXTRA: |
    /* --- YKA development configuration (generated by docker-compose) --- */
    define( 'WP_ENVIRONMENT_TYPE', getenv( 'WP_ENVIRONMENT_TYPE' ) ?: 'local' );

    if ( ! empty( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) {
        $$_SERVER['HTTPS'] = 'on';
    }

    if ( 'production' !== WP_ENVIRONMENT_TYPE && ! empty( $$_SERVER['HTTP_HOST'] ) ) {
        $$yka_scheme = ( ! empty( $$_SERVER['HTTPS'] ) && 'off' !== $$_SERVER['HTTPS'] ) ? 'https' : 'http';
        $$yka_host   = preg_replace( '/[^A-Za-z0-9\.\-:]/', '', (string) $$_SERVER['HTTP_HOST'] );
        define( 'WP_HOME', $$yka_scheme . '://' . $$yka_host );
        define( 'WP_SITEURL', $$yka_scheme . '://' . $$yka_host );
    }

    define( 'WP_DEBUG_LOG', ${WP_DEBUG_LOG:-true} );
    define( 'WP_DEBUG_DISPLAY', ${WP_DEBUG_DISPLAY:-false} );
    @ini_set( 'display_errors', 0 );

    define( 'DISALLOW_FILE_EDIT', true );
    define( 'AUTOMATIC_UPDATER_DISABLED', true );
    define( 'WP_MEMORY_LIMIT', '512M' );
    define( 'WP_MAX_MEMORY_LIMIT', '512M' );
    define( 'WP_POST_REVISIONS', 12 );
    define( 'EMPTY_TRASH_DAYS', 30 );
  WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}

services:
  db:
    image: mariadb:11.4
    container_name: ${COMPOSE_PROJECT_NAME:-yka}-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=128M
    environment:
      MARIADB_DATABASE: ${DB_NAME:-yka_wordpress}
      MARIADB_USER: ${DB_USER:-yka}
      MARIADB_PASSWORD: ${DB_PASSWORD:-yka}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  wordpress:
    image: wordpress:php8.3-apache
    container_name: ${COMPOSE_PROJECT_NAME:-yka}-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *wp-env
    ports:
      - "${WP_PORT:-8080}:80"
    volumes:
      # WordPress core, extracted from the supplied zip. Not in Git.
      - ./wp:/var/www/html
      # Custom project code lives in the repository and is mounted in place.
      - ./wp-content/themes/yka-portal:/var/www/html/wp-content/themes/yka-portal
      - ./wp-content/plugins/yka-core:/var/www/html/wp-content/plugins/yka-core
      - ./config/php/uploads.ini:/usr/local/etc/php/conf.d/zz-yka-uploads.ini:ro
      - ./config/php/mail.ini:/usr/local/etc/php/conf.d/zz-yka-mail.ini:ro

  wpcli:
    image: wordpress:cli-php8.3
    container_name: ${COMPOSE_PROJECT_NAME:-yka}-cli
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment: *wp-env
    volumes:
      - ./wp:/var/www/html
      - ./wp-content/themes/yka-portal:/var/www/html/wp-content/themes/yka-portal
      - ./wp-content/plugins/yka-core:/var/www/html/wp-content/plugins/yka-core
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -f /dev/null"]

  pma:
    image: phpmyadmin:5
    container_name: ${COMPOSE_PROJECT_NAME:-yka}-pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    ports:
      - "${PMA_PORT:-8081}:80"
    profiles: ["tools"]

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-yka}-mail
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  db-data:
