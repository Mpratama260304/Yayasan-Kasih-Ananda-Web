# ---------------------------------------------------------------
# Yayasan Kasih Ananda Web Portal — development stack
#
# Services
#   db        MariaDB 11.4 LTS
#   wordpress WordPress 7.1 (core extracted from wordpress-7.1.zip into ./wp)
#   wpcli     WP-CLI runner (one-shot container used by ./scripts/*)
#   pma       phpMyAdmin (optional convenience)
#   mailpit   local SMTP sink — no development mail ever leaves the machine
#
# Nothing in this file is used in production. Production runs on plain
# PHP/MySQL WordPress hosting with no Docker and no Node.
# ---------------------------------------------------------------

name: ${COMPOSE_PROJECT_NAME:-yka}

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: ${DB_NAME:-yka_wordpress}
  WORDPRESS_DB_USER: ${DB_USER:-yka}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-yka}
  WORDPRESS_TABLE_PREFIX: ${DB_TABLE_PREFIX:-wp_}
  WORDPRESS_DEBUG: ${WP_DEBUG:-true}
  # The official image runs this string through eval(). Keep it to a single
  # require so the actual configuration lives in a real, version-controlled,
  # lintable file — see config/wp/yka-config.php.
  WORDPRESS_CONFIG_EXTRA: "require_once '/usr/local/etc/yka-config.php';"
  WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}
  WP_DEBUG_LOG: ${WP_DEBUG_LOG:-true}
  WP_DEBUG_DISPLAY: ${WP_DEBUG_DISPLAY:-false}
  # Fallback public address, used only when a tunnel forwards HTTPS but does
  # not tell us which hostname the visitor typed. Set by scripts/lib.sh.
  YKA_PUBLIC_URL: ${YKA_PUBLIC_URL:-}

services:
  db:
    image: mariadb:11.4
    container_name: ${COMPOSE_PROJECT_NAME:-yka}-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=128M
    environment:
      MARIADB_DATABASE: ${DB_NAME:-yka_wordpress}
      MARIADB_USER: ${DB_USER:-yka}
      MARIADB_PASSWORD: ${DB_PASSWORD:-yka}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  wordpress:
    image: wordpress:php8.3-apache
    container_name: ${COMPOSE_PROJECT_NAME:-yka}-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *wp-env
    ports:
      - "${WP_PORT:-8080}:80"
    volumes:
      # WordPress core, extracted from the supplied zip. Not in Git.
      - ./wp:/var/www/html
      # Custom project code lives in the repository and is mounted in place.
      - ./wp-content/themes/yka-portal:/var/www/html/wp-content/themes/yka-portal
      - ./wp-content/plugins/yka-core:/var/www/html/wp-content/plugins/yka-core
      - ./config/php/uploads.ini:/usr/local/etc/php/conf.d/zz-yka-uploads.ini:ro
      - ./config/php/mail.ini:/usr/local/etc/php/conf.d/zz-yka-mail.ini:ro
      # Kept outside the document root so it can never be requested directly.
      - ./config/wp/yka-config.php:/usr/local/etc/yka-config.php:ro

  wpcli:
    image: wordpress:cli-php8.3
    container_name: ${COMPOSE_PROJECT_NAME:-yka}-cli
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment: *wp-env
    volumes:
      - ./wp:/var/www/html
      - ./wp-content/themes/yka-portal:/var/www/html/wp-content/themes/yka-portal
      - ./wp-content/plugins/yka-core:/var/www/html/wp-content/plugins/yka-core
      - ./config/wp/yka-config.php:/usr/local/etc/yka-config.php:ro
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -f /dev/null"]

  pma:
    image: phpmyadmin:5
    container_name: ${COMPOSE_PROJECT_NAME:-yka}-pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    ports:
      - "${PMA_PORT:-8081}:80"
    profiles: ["tools"]

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-yka}-mail
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  db-data:
